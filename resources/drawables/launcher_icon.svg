<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="24" height="24" fill="#1a1a1a"/>

  <!-- Calculator body with rounded corners -->
  <rect x="3" y="2" width="18" height="20" rx="2" ry="2" fill="#2d2d2d" stroke="#4a4a4a" stroke-width="0.5"/>

  <!-- Display area -->
  <rect x="5" y="4" width="14" height="4.5" rx="0.5" ry="0.5" fill="#0a0a0a"/>

  <!-- Display text (numbers) -->
  <text x="17" y="7.5" font-family="monospace" font-size="2.5" fill="#00ff00" text-anchor="end" font-weight="bold">123</text>

  <!-- Button grid -->
  <!-- Row 1 -->
  <rect x="5" y="9.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="6.5" y="11.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">7</text>

  <rect x="8.5" y="9.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="10" y="11.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">8</text>

  <rect x="12" y="9.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="13.5" y="11.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">9</text>

  <rect x="15.5" y="9.5" width="3" height="2.5" rx="0.3" fill="#ff9500" stroke="#ffb143" stroke-width="0.4"/>
  <text x="17" y="11.2" font-family="sans-serif" font-size="1.2" fill="#fff" text-anchor="middle" font-weight="bold">÷</text>

  <!-- Row 2 -->
  <rect x="5" y="12.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="6.5" y="14.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">4</text>

  <rect x="8.5" y="12.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="10" y="14.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">5</text>

  <rect x="12" y="12.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="13.5" y="14.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">6</text>

  <rect x="15.5" y="12.5" width="3" height="2.5" rx="0.3" fill="#ff9500" stroke="#ffb143" stroke-width="0.4"/>
  <text x="17" y="14.2" font-family="sans-serif" font-size="1.2" fill="#fff" text-anchor="middle" font-weight="bold">×</text>

  <!-- Row 3 -->
  <rect x="5" y="15.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="6.5" y="17.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">1</text>

  <rect x="8.5" y="15.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="10" y="17.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">2</text>

  <rect x="12" y="15.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="13.5" y="17.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">3</text>

  <rect x="15.5" y="15.5" width="3" height="2.5" rx="0.3" fill="#ff9500" stroke="#ffb143" stroke-width="0.4"/>
  <text x="17" y="17.2" font-family="sans-serif" font-size="1.2" fill="#fff" text-anchor="middle" font-weight="bold">−</text>

  <!-- Row 4 -->
  <rect x="5" y="18.5" width="6.5" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="8.25" y="20.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">0</text>

  <rect x="12" y="18.5" width="3" height="2.5" rx="0.3" fill="#3d3d3d" stroke="#555" stroke-width="0.4"/>
  <text x="13.5" y="20.2" font-family="sans-serif" font-size="1.2" fill="#e0e0e0" text-anchor="middle" font-weight="bold">.</text>

  <rect x="15.5" y="18.5" width="3" height="2.5" rx="0.3" fill="#4CAF50" stroke="#66BB6A" stroke-width="0.4"/>
  <text x="17" y="20.2" font-family="sans-serif" font-size="1.2" fill="#fff" text-anchor="middle" font-weight="bold">=</text>
</svg>
